<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -8 120 120" fill="none">
  <!--
    Marca da demandou: monograma "dp" de "demandou, postou".
    O d e o p são a mesma forma girada 180 graus e compartilham a bola central,
    então a marca tem simetria rotacional exata.

    Versão de 25/08/2026, a partir do painel de identidade novo do Bruno:
    o disco de fundo saiu, o laranja virou degradê (medido do painel:
    #F1742E claro no alto, #BE4720 profundo embaixo) e o contorno branco
    estilo adesivo ficou, que é o que dá contraste em qualquer fundo.
    A geometria é a mesma vetorizada em 22/08, do desenho dele.
  -->
  <defs>
    <linearGradient id="marca-laranja" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1742E" />
      <stop offset="1" stop-color="#BE4720" />
    </linearGradient>
  </defs>

  <!-- Contorno branco: as mesmas formas, mais largas, por baixo do laranja -->
  <circle cx="32" cy="52" r="26" stroke="#ffffff" stroke-width="17" />
  <rect x="49.5" y="1.5" width="17" height="61" rx="8.5" fill="#ffffff" />
  <rect x="-2.5" y="41.5" width="17" height="61" rx="8.5" fill="#ffffff" />

  <!-- A marca -->
  <circle cx="32" cy="52" r="26" stroke="url(#marca-laranja)" stroke-width="12" />
  <rect x="52" y="4" width="12" height="56" rx="6" fill="url(#marca-laranja)" />
  <rect x="0" y="44" width="12" height="56" rx="6" fill="url(#marca-laranja)" />
</svg>
